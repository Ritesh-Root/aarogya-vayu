<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Aarogya-Vāyu</title>
  <desc id="d">Medicine moves from a clinic with spare stock to a clinic about to run out, while smog drifts overhead.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBEFE7"/>
      <stop offset="1" stop-color="#F6DCCD"/>
    </linearGradient>
    <linearGradient id="smog" x1="0" x2="1">
      <stop offset="0" stop-color="#B9A79C" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B9A79C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B9A79C" stop-opacity="0"/>
    </linearGradient>
    <path id="route" d="M1130 268 C 1040 150, 900 150, 812 268"/>
    <style>
      .h { font: 800 64px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #2E221D; letter-spacing: -1.5px; }
      .dv { font: 700 30px 'Noto Sans Devanagari','Nirmala UI','Kohinoor Devanagari','Devanagari MT',sans-serif; fill: #C95836; }
      .s { font: 500 23px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #5C4A44; }
      .chip { font: 700 15px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #2E221D; }
      .lbl { font: 800 15px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #fff; }
      .cap { font: 700 15px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #5C4A44; }
      .km { font: 800 16px 'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; fill: #C95836; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>

  <!-- drifting smog bands -->
  <g>
    <rect x="-400" y="26" width="900" height="16" rx="8" fill="url(#smog)">
      <animate attributeName="x" values="-400;1280" dur="18s" repeatCount="indefinite"/>
    </rect>
    <rect x="-700" y="52" width="700" height="12" rx="6" fill="url(#smog)" opacity=".8">
      <animate attributeName="x" values="-700;1280" dur="24s" begin="-6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-500" y="74" width="600" height="8" rx="4" fill="url(#smog)" opacity=".6">
      <animate attributeName="x" values="-500;1280" dur="30s" begin="-15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- text -->
  <text x="72" y="150" class="h">Aarogya-Vāyu</text>
  <text x="76" y="196" class="dv">आरोग्य-वायु</text>
  <text x="74" y="246" class="s">Moves medicine to rural clinics before</text>
  <text x="74" y="278" class="s">smog or heat empties their shelves.</text>

  <g transform="translate(74 312)">
    <rect width="168" height="36" rx="18" fill="#fff" stroke="#DE6B48" stroke-opacity=".35"/>
    <text x="84" y="23" text-anchor="middle" class="chip">Gemini 3.8 Flash</text>
    <rect x="180" width="150" height="36" rx="18" fill="#fff" stroke="#DE6B48" stroke-opacity=".35"/>
    <text x="255" y="23" text-anchor="middle" class="chip">Live air data</text>
    <rect x="342" width="170" height="36" rx="18" fill="#fff" stroke="#DE6B48" stroke-opacity=".35"/>
    <text x="427" y="23" text-anchor="middle" class="chip">Doctor approves</text>
  </g>

  <!-- route -->
  <use href="#route" fill="none" stroke="#DE6B48" stroke-width="3" stroke-dasharray="9 9" opacity=".7">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="1.2s" repeatCount="indefinite"/>
  </use>
  <text x="971" y="170" text-anchor="middle" class="km">30.2 km</text>

  <!-- donor clinic (has spare) -->
  <g transform="translate(1080 262)">
    <path d="M0 22 L50 -8 L100 22 Z" fill="#2F6B52"/>
    <rect x="8" y="22" width="84" height="66" rx="6" fill="#E8F0EC" stroke="#2F6B52" stroke-width="3"/>
    <rect x="40" y="52" width="20" height="36" rx="3" fill="#2F6B52"/>
    <rect x="26" y="-40" width="48" height="26" rx="7" fill="#2F6B52"/>
    <text x="50" y="-20" text-anchor="middle" class="lbl">CHC</text>
    <text x="50" y="112" text-anchor="middle" class="cap">has spare</text>
  </g>

  <!-- clinic running out -->
  <g transform="translate(762 262)">
    <path d="M0 22 L50 -8 L100 22 Z" fill="#B4321E"/>
    <rect x="8" y="22" width="84" height="66" rx="6" fill="#FBE4DE" stroke="#B4321E" stroke-width="3"/>
    <rect x="40" y="52" width="20" height="36" rx="3" fill="#B4321E"/>
    <rect x="26" y="-40" width="48" height="26" rx="7" fill="#B4321E"/>
    <text x="50" y="-20" text-anchor="middle" class="lbl">PHC</text>
    <text x="50" y="112" text-anchor="middle" class="cap">
      <tspan>0.5 days left</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.55;.6;.95;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="112" text-anchor="middle" class="cap" fill="#2F6B52" opacity="0" style="fill:#2F6B52">
      <tspan>8.8 days left</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.55;.6;.95;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- medicine box travelling along the route -->
  <g>
    <rect x="-17" y="-13" width="34" height="26" rx="5" fill="#DE6B48" stroke="#fff" stroke-width="2"/>
    <path d="M-5 0 H5 M0 -5 V5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.55;1" calcMode="linear">
      <mpath href="#route"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.55;.6;1" dur="5s" repeatCount="indefinite"/>
  </g>
</svg>
