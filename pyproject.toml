[project]
name = "aarogya-vayu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-aiplatform>=2.1.0",
    "google-cloud-speech>=2.40.0",
    "google-cloud-texttospeech>=2.37.0",
    "google-cloud-vision>=3.15.0",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.2",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
aarogya-vayu = "aarogya_vayu:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
